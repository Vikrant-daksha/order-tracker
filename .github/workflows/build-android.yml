name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}
      EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}

    steps:
      # ─────────────────────────────────────────────────────────────────
      # 1. Source code & Environment setup
      # ─────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env files from GitHub Secrets
        run: |
          mkdir -p artifacts/order-mgr
          cat << 'EOF' > artifacts/order-mgr/.env
          EXPO_PUBLIC_GEMINI_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}
          EXPO_PUBLIC_PROJECT_ID=${{ secrets.EXPO_PUBLIC_PROJECT_ID }}
          EOF
          cp artifacts/order-mgr/.env .env

      # ─────────────────────────────────────────────────────────────────
      # 2. Toolchain
      # ─────────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Android NDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────────────────
      # 3. Install ALL workspace dependencies from repo root
      # ─────────────────────────────────────────────────────────────────
      - name: Install workspace dependencies (repo root)
        run: pnpm install --no-frozen-lockfile

      # ─────────────────────────────────────────────────────────────────
      # 4. Expo Prebuild — regenerates android/ fresh from current app.json
      # ─────────────────────────────────────────────────────────────────
      - name: Expo Prebuild
        working-directory: artifacts/order-mgr
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}
          EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}

      # ─────────────────────────────────────────────────────────────────
      # 5. Pre-build the JS bundle ourselves (visible errors, no Gradle magic)
      # ─────────────────────────────────────────────────────────────────
      - name: Build JS bundle (Metro)
        working-directory: artifacts/order-mgr
        run: |
          mkdir -p android/app/build/generated/assets/createBundleReleaseJsAndAssets
          mkdir -p android/app/build/generated/res/bundleReleaseJsAndAssets
          npx expo export:embed \
            --platform android \
            --dev false \
            --bundle-output android/app/build/generated/assets/createBundleReleaseJsAndAssets/index.android.bundle \
            --assets-dest android/app/build/generated/res/bundleReleaseJsAndAssets
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}
          EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}

      # ─────────────────────────────────────────────────────────────────
      # 6. Decode release keystore
      # ─────────────────────────────────────────────────────────────────
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > artifacts/order-mgr/android/app/my-release-key.keystore

      # ─────────────────────────────────────────────────────────────────
      # 7. Gradle build
      # ─────────────────────────────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: artifacts/order-mgr/android
        run: chmod +x ./gradlew

      - name: Build Release APK
        working-directory: artifacts/order-mgr/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/artifacts/order-mgr/android/app/my-release-key.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -PbundleJsAndAssets=false \
            --no-daemon \
            --stacktrace
        env:
          EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_KEY }}
          EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}

      # ─────────────────────────────────────────────────────────────────
      # 8a. Upload to Actions tab
      # ─────────────────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-release-apk
          path: artifacts/order-mgr/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # ─────────────────────────────────────────────────────────────────
      # 8b. Create GitHub Release (only on v* tags)
      # ─────────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "OrderFlow ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/order-mgr/android/app/build/outputs/apk/release/app-release.apk
