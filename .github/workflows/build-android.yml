name: Build Android APK

on:
  # Trigger a release build when you push a version tag  e.g. git tag v1.2.0 && git push --tags
  push:
    tags:
      - "v*"
  # Also allow manual runs from the Actions tab (no release created for manual runs)
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    # Allow the job to create GitHub Releases and upload assets
    permissions:
      contents: write

    steps:
      # ─────────────────────────────────────────────────────────────────
      # 1. Source code
      # ─────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────
      # 2. Toolchain
      # ─────────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      # ─────────────────────────────────────────────────────────────────
      # 3. Install JS dependencies for the app sub-package
      # ─────────────────────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: artifacts/order-mgr
        run: pnpm install --frozen-lockfile

      # ─────────────────────────────────────────────────────────────────
      # 4. Expo Prebuild  (generates / refreshes the android/ folder)
      #    Remove this step if you commit your android/ folder to git.
      # ─────────────────────────────────────────────────────────────────
      - name: Expo Prebuild (generate native Android folder)
        working-directory: artifacts/order-mgr
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: "1"

      # ─────────────────────────────────────────────────────────────────
      # 5. Signing
      #
      #    Required GitHub Secrets  (Settings -> Secrets -> Actions):
      #      ANDROID_KEYSTORE_BASE64   base64-encoded .keystore file
      #      ANDROID_KEY_ALIAS         key alias  (e.g. my-key-alias)
      #      ANDROID_STORE_PASSWORD    keystore password
      #      ANDROID_KEY_PASSWORD      key password (often same as store)
      #
      #    To encode your keystore on Windows PowerShell:
      #      [Convert]::ToBase64String([IO.File]::ReadAllBytes("my-release-key.keystore"))
      #    On macOS / Linux:
      #      base64 -w 0 my-release-key.keystore
      # ─────────────────────────────────────────────────────────────────
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > artifacts/order-mgr/android/app/my-release-key.keystore

      # ─────────────────────────────────────────────────────────────────
      # 6. Gradle build  (signing injected via -P flags — no changes
      #    needed inside build.gradle)
      # ─────────────────────────────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: artifacts/order-mgr/android
        run: chmod +x ./gradlew

      - name: Build Release APK
        working-directory: artifacts/order-mgr/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/artifacts/order-mgr/android/app/my-release-key.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --no-daemon

      # ─────────────────────────────────────────────────────────────────
      # 7a. Upload to Actions tab  (available on every run, tag or not)
      # ─────────────────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-release-apk
          path: artifacts/order-mgr/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # ─────────────────────────────────────────────────────────────────
      # 7b. Create a GitHub Release and attach the APK
      #     Only runs when the workflow was triggered by a version tag.
      #     The release name and tag come from the git tag automatically.
      #     e.g. pushing tag "v1.2.0" creates release "OrderFlow v1.2.0"
      # ─────────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "OrderFlow ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true   # auto-generates changelog from commit messages
          files: |
            artifacts/order-mgr/android/app/build/outputs/apk/release/app-release.apk
