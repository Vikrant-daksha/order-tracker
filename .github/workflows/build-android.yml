name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ─────────────────────────────────────────────────────────────────
      # 1. Source code
      # ─────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────
      # 2. Toolchain
      # ─────────────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      # ─────────────────────────────────────────────────────────────────
      # 3. Install ALL workspace dependencies from the repo root
      #    This ensures @workspace/* packages in /lib are resolved.
      # ─────────────────────────────────────────────────────────────────
      - name: Install workspace dependencies (repo root)
        run: pnpm install --no-frozen-lockfile

      # ─────────────────────────────────────────────────────────────────
      # 4. Expo Prebuild
      # ─────────────────────────────────────────────────────────────────
      - name: Expo Prebuild
        working-directory: artifacts/order-mgr
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: "1"

      # ─────────────────────────────────────────────────────────────────
      # 5. Pre-flight: run Metro bundler STANDALONE before Gradle
      #    This step exists ONLY to surface the real JS error clearly.
      #    When Gradle runs Metro internally, errors are swallowed behind
      #    "node exited with code 1". Running it here shows the full error
      #    in its own step so you can read it directly.
      #    If this step passes, the Gradle bundle will pass too.
      # ─────────────────────────────────────────────────────────────────
      - name: Pre-flight JS bundle check (surface Metro errors)
        working-directory: artifacts/order-mgr
        run: |
          npx expo export:embed \
            --platform android \
            --dev false \
            --bundle-output /tmp/preflight-bundle.js \
            --assets-dest /tmp/preflight-assets \
            --entry-file node_modules/expo-router/entry.js
        env:
          NODE_ENV: production
          EXPO_NO_TELEMETRY: "1"

      # ─────────────────────────────────────────────────────────────────
      # 6. Decode release keystore
      # ─────────────────────────────────────────────────────────────────
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > artifacts/order-mgr/android/app/my-release-key.keystore

      # ─────────────────────────────────────────────────────────────────
      # 7. Gradle build
      # ─────────────────────────────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: artifacts/order-mgr/android
        run: chmod +x ./gradlew

      - name: Build Release APK
        working-directory: artifacts/order-mgr/android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/artifacts/order-mgr/android/app/my-release-key.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --no-daemon \
            --stacktrace

      # ─────────────────────────────────────────────────────────────────
      # 8a. Upload to Actions tab (every run)
      # ─────────────────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-release-apk
          path: artifacts/order-mgr/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # ─────────────────────────────────────────────────────────────────
      # 8b. Create GitHub Release + attach APK (only on v* tag pushes)
      # ─────────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "OrderFlow ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/order-mgr/android/app/build/outputs/apk/release/app-release.apk
